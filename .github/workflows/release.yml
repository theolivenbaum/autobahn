name: Release

# Publishing happens on a tag, never on a push. A merge to main must not be able
# to release anything - that was the inherited workflow's mistake, and it published
# under an identity this fork does not own.
on:
  push:
    tags: [ 'v*' ]

permissions:
  contents: write

jobs:
  release:
    name: Pack and publish
    runs-on: ubuntu-latest
    environment: nuget

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          global-json-file: global.json

      # The tag is the version. Nothing is published that has not passed the same
      # full suite main runs, so the tests run here too rather than being trusted
      # from an earlier job on a different commit.
      - name: Read the version from the tag
        id: version
        run: echo "value=${GITHUB_REF_NAME#v}" >> "$GITHUB_OUTPUT"

      # Before the build, because the CLI embeds the compiled UI as a resource: a
      # release built without this step ships a tool whose live view is a page
      # explaining that it was not built in.
      - name: Install the Transpose compiler
        run: |
          dotnet tool update --global Transpose.Compiler
          echo "$HOME/.dotnet/tools" >> "$GITHUB_PATH"

      - name: Build and stage the UI
        run: ./scripts/build-ui.sh Release

      - name: Build
        run: dotnet build --configuration Release -p:Version=${{ steps.version.outputs.value }}

      - name: Test
        run: dotnet test --no-build --configuration Release

      - name: Pack
        run: |
          dotnet pack --no-build --configuration Release \
            -p:Version=${{ steps.version.outputs.value }} \
            --output ./artifacts

      - name: Publish to NuGet
        run: |
          dotnet nuget push "./artifacts/*.nupkg" \
            --api-key "${{ secrets.NUGET_API_KEY }}" \
            --source https://api.nuget.org/v3/index.json \
            --skip-duplicate

      - name: Attach the packages to the release
        uses: softprops/action-gh-release@v2
        with:
          files: ./artifacts/*.nupkg
          generate_release_notes: true
